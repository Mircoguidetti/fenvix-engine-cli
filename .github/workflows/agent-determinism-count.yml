name: agent-determinism-count

# Agent-determinism count (harness/agent_determinism_count/): reads public repository trees, manifests, workflow files,
# Actions run/job metadata, commit dates and issue comments with this workflow's GITHUB_TOKEN (GET only; read-only on
# every other repository). A chunk starts when a push to this branch adds a request file
# harness/agent_determinism_count/requests/<n>.json; every request file without a results/requests_done/ marker is
# processed (a job-wide deadline stops it cleanly; the rest waits for the next push). Results are committed back to this branch only (a push made with
# GITHUB_TOKEN does not start another workflow run).

on:
  push:
    branches: [claude/agent-determinism-count]
    paths:
      - harness/agent_determinism_count/requests/**

permissions:
  contents: write

concurrency:
  group: agent-determinism-count
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  ADC_BRANCH: claude/agent-determinism-count

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r harness/agent_determinism_count/requirements.txt
      - name: Latest checkpoint
        run: |
          echo "ADC_DEADLINE=$(( $(date +%s) + 320 * 60 ))" >> "$GITHUB_ENV"
          git fetch -q origin "$ADC_BRANCH"
          git checkout -q -B adc "origin/$ADC_BRANCH"
          git log --oneline -1
      - name: Chunks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # every request file without a results/requests_done/<name> marker (not only this push's files: a newer
          # push cancels a pending run of the same concurrency group, and a stopped request is resumed)
          d=harness/agent_determinism_count
          for f in $(ls -1 "$d/requests" 2>/dev/null | sort -V); do
            if [ -e "$d/results/requests_done/$f" ]; then continue; fi
            if [ "$(date +%s)" -gt "$(( ADC_DEADLINE - 900 ))" ]; then echo "deadline: $f left for the next run"; break; fi
            echo "== $f"; cat "$d/requests/$f"
            python3 "$d/job.py" --request "$d/requests/$f"
          done
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "agent-determinism-count-bot"
          git config user.email "agent-determinism-count-bot@users.noreply.github.com"
          out=harness/agent_determinism_count/results
          [ -d "$out" ] || exit 0
          # only the files this workflow writes (the work session writes the others; never overwrite them)
          own="rows.jsonl raw chunks.jsonl chunk_errors.jsonl requests_done texts_search_wf.jsonl texts_raw_wf comments.jsonl comments_raw probe_workflow.json debug"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$ADC_BRANCH" && git reset -q --soft "origin/$ADC_BRANCH" && git reset -q
            for p in $own; do if [ -e "$out/$p" ]; then git add -f "$out/$p"; fi; done
            git commit -q -m "agent-determinism-count: results (run ${{ github.run_id }})" || exit 0
            git push -q origin "HEAD:$ADC_BRANCH" && exit 0
            sleep $((5 + RANDOM % 20))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-determinism-count-results-${{ github.run_id }}
          path: harness/agent_determinism_count/results/
          if-no-files-found: ignore
