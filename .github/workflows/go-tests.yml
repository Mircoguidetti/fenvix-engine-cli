# Engine tests of the Go shell (fenvix-go) and its C ABI crate, on every push
# of the Go branch.
name: go-tests

on:
  push:
    branches: [claude/go-l0]
    paths: ["go/**", "crates/**", ".github/workflows/go-tests.yml"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Rust core and C ABI
        run: cargo test -q -p detpy-core -p fenvix-go && cargo build -q -p fenvix-go --release
      - name: Go shell
        working-directory: go
        run: go vet ./... && go test -count=1 -v ./... 2>&1 | tee /tmp/go-test.log | grep -E "^(=== RUN|--- |ok|FAIL|PASS)|native outcomes|failing in some seed" ; exit ${PIPESTATUS[0]}
      - name: Older and newer toolchains (controls fixture, two --det runs each, verified)
        working-directory: go
        run: |
          go build -o /tmp/fenvix-go ./cmd/fenvix-go
          cp -r testdata/fixtures/controls /tmp/old && sed -i 's/^go 1.24/go 1.22/' /tmp/old/go.mod
          # the fixture's tests may fail (it holds flaky tests); a build failure must not (review R-025 D4)
          for v in go1.22.12 go1.23.12 go1.24.7 go1.25.4 go1.26.0; do
            for r in 1 2; do
              (cd /tmp/old && GOTOOLCHAIN=$v /tmp/fenvix-go test --det --det-trace=/tmp/$v-$r.jsonl . > /tmp/$v-$r.log 2>&1 || true)
              grep fenvix-go /tmp/$v-$r.log
              if grep -qE "build failed|setup failed" /tmp/$v-$r.log || [ ! -s /tmp/$v-$r.jsonl ]; then cat /tmp/$v-$r.log; exit 1; fi
            done
            /tmp/fenvix-go verify /tmp/$v-1.jsonl /tmp/$v-2.jsonl | sed -n 5,6p
          done
