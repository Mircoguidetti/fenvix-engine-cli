# Packages and platforms (rows F-10, F-09, PY-01, JS-01).
#
# build     per platform (Linux x86_64, Linux arm64, macOS arm64): Rust core tests, the PyPI wheel `fenvix`
#           (cp312-abi3; manylinux_2_28 on Linux via zig, macosx_11_0 on macOS), the napi addon for the npm package
#           `@fenvix/<platform>`, the platform floor check (glibc 2.28 / macOS 11), the sdist (x86_64 job).
# packages  the npm packages `fenvix` + `@fenvix/<platform>` (release/npm/pack.py), `npm publish --dry-run` of
#           each, `twine check` of the wheels and the sdist, one version everywhere (release/version.py).
# install   per platform x (Python, Node) pair, on a clean runner WITHOUT a checkout of this repository: install
#           only the built packages, `fenvix --version`, `pytest --det` and `--det-cache` on a small real Python
#           project, `fenvix vitest run --det` and `--det-cache` on a small real Vitest project; on CPython 3.11 pip
#           refuses the package and a forced copy refuses at start (release/install_test.py).
# python    the full Python suites on Linux arm64 and macOS arm64, CPython 3.12 / 3.13 / 3.14 (Linux x86_64 runs
#           in release-1.yml).
# node      the full detjs suites on Linux arm64 and macOS arm64, Node 22 / 24 / 26 (Linux x86_64: release-1.yml).
name: packages

on:
  pull_request:
    branches: [claude/release-1]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: "build this version instead of the checkout's (release/version.py X), e.g. 0.1.0-rc.7 for TestPyPI"
        type: string
        default: ""

concurrency:
  group: packages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, triple: linux-x64-gnu, target: x86_64-unknown-linux-gnu, lib: libdetpy_node.so}
          - {os: ubuntu-24.04-arm, triple: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, lib: libdetpy_node.so}
          - {os: macos-14, triple: darwin-arm64, target: aarch64-apple-darwin, lib: libdetpy_node.dylib}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: tools
        run: |
          rustup target add ${{ matrix.target }}
          pip install "maturin>=1.5,<2" twine
          if [ "$RUNNER_OS" = Linux ]; then pip install ziglang cargo-zigbuild; fi
      - name: one version everywhere
        run: |
          if [ -n "${{ inputs.version }}" ]; then python3 release/version.py "${{ inputs.version }}"; fi
          python3 release/version.py
      - name: Rust core tests (host observation layer included)
        run: cargo test -p detpy-core 2>&1 | grep -E "^test result|FAILED|panicked"; exit ${PIPESTATUS[0]}
      - name: wheel
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            maturin build --release --zig --compatibility manylinux_2_28 --target ${{ matrix.target }} -o dist
          else
            maturin build --release --target ${{ matrix.target }} -o dist
          fi
      - name: sdist
        if: matrix.triple == 'linux-x64-gnu'
        run: maturin sdist -o dist
      - name: napi addon (@fenvix/${{ matrix.triple }})
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild -p detpy-node --release --target ${{ matrix.target }}.2.28
          else
            cargo build -p detpy-node --release --target ${{ matrix.target }}
          fi
          mkdir -p addons && cp target/${{ matrix.target }}/release/${{ matrix.lib }} addons/fenvix.${{ matrix.triple }}.node
      - name: platform floor (glibc 2.28 / macOS 11)
        run: python3 release/check_floor.py dist/*.whl addons/*.node
      - uses: actions/upload-artifact@v4
        with: {name: "wheels-${{ matrix.triple }}", path: dist/}
      - uses: actions/upload-artifact@v4
        with: {name: "addon-${{ matrix.triple }}", path: addons/}

  packages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with: {pattern: "wheels-*", path: wheels, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: "addon-*", path: addons, merge-multiple: true}
      - name: wheels and sdist (twine check)
        run: |
          pip install twine && ls -l wheels && twine check --strict wheels/*
          test "$(ls wheels/*.whl | wc -l)" -eq 3 && ls wheels/*.tar.gz
      - name: npm packages (fenvix + @fenvix/<platform>), npm publish --dry-run
        run: |
          if [ -n "${{ inputs.version }}" ]; then python3 release/version.py "${{ inputs.version }}"; fi
          python3 release/npm/pack.py --addons addons --out npm-out --pack --require-all
          for d in npm-out/fenvix npm-out/@fenvix/*; do (cd "$d" && npm publish --dry-run --access public 2>&1 | tail -4); done
      - name: version
        id: v
        run: echo "version=$(python3 release/version.py)" >> "$GITHUB_OUTPUT"
      - run: cp release/install_test.py npm-out/
      - uses: actions/upload-artifact@v4
        with: {name: wheels, path: wheels/}
      - uses: actions/upload-artifact@v4
        with: {name: npm-tarballs, path: npm-out/tarballs/}
      - uses: actions/upload-artifact@v4
        with: {name: install-test, path: npm-out/install_test.py}
    outputs:
      version: ${{ steps.v.outputs.version }}

  install:
    name: install (${{ matrix.os }}, py ${{ matrix.python }}, node ${{ matrix.node }})
    needs: packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        python: ["3.12", "3.13", "3.14"]
        include:
          - {python: "3.12", node: "22"}
          - {python: "3.13", node: "24"}
          - {python: "3.14", node: "26"}
    steps:
      # no checkout: only the built packages and the test script
      - uses: actions/setup-python@v5
        id: py311
        with: {python-version: "3.11"}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/download-artifact@v4
        with: {name: wheels, path: wheels}
      - uses: actions/download-artifact@v4
        with: {name: npm-tarballs, path: npm}
      - uses: actions/download-artifact@v4
        with: {name: install-test, path: t}
      - name: install only the packages; real Python and Vitest projects; Python 3.11 refused
        run: |
          python t/install_test.py --wheels wheels --npm npm --version "${{ needs.packages.outputs.version }}" \
            --work "$RUNNER_TEMP/it" --py311 "${{ steps.py311.outputs.python-path }}" --out install-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "install-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}"
          path: |
            install-result.json
            ${{ runner.temp }}/it/logs/

  python:
    name: python suites (${{ matrix.os }}, ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "wheels-*", path: wheels, merge-multiple: true}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - name: install the wheel of this platform (and its extension in python/detpy)
        run: |
          pip install pytest pytest-xdist
          pip install --no-deps --no-index --find-links wheels --only-binary :all: fenvix
          cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: Python suites and reviewer test files
        run: |
          python -m pytest -q -p no:randomly --junitxml=py.xml tests \
            --deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does \
            -rfE 2>&1 | tee py.log | tail -60; rc=${PIPESTATUS[0]}
          echo "== failures"; grep -E "^(FAILED|ERROR) " py.log || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "python-${{ matrix.os }}-${{ matrix.python }}", path: "py.*"}

  node:
    name: node suites (${{ matrix.os }}, ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {pattern: "addon-*", path: addons, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {pattern: "wheels-*", path: wheels, merge-multiple: true}
      - name: the addon of this platform, the wheel (verifier used by some suites)
        run: |
          triple="$(node -p 'require("./node/src/platform").platformTriple().triple')"
          cp "addons/fenvix.$triple.node" "node/detjs.$(node -p 'process.platform+"-"+process.arch').node"
          pip install --no-deps --no-index --find-links wheels --only-binary :all: fenvix
      - name: detjs suites and reviewer test files
        working-directory: node
        run: |
          npm ci --no-audit --no-fund
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../node-tests.xml test/*.test.js > ../node-tests.log 2>&1; rc=$?
          tail -40 ../node-tests.log; echo "== failures"; grep -nE "✖|not ok" ../node-tests.log | head -80 || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "node-${{ matrix.os }}-${{ matrix.node }}", path: "node-tests.*"}
