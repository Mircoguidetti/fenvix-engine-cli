name: publish-results

# Commit the results artifact of a harness run to the branch tip
# (used when the run's own commit step could not push).
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "harness run id", required: true}
      result_set: {description: "results directory name under harness/results", default: "mixed"}

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/download-artifact@v4
        with:
          name: "results-${{ inputs.result_set }}"
          path: /tmp/results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          set -e
          dest="harness/results/${{ inputs.result_set }}"
          rm -rf "$dest" && mkdir -p "$dest" && cp -r /tmp/results/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$dest"
          git commit -m "Harness results (${{ inputs.result_set }}) from Actions run ${{ inputs.run_id }}" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
