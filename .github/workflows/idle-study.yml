name: idle-study

# Idle-share and baseline-flakiness study (harness/idle_study).
# Triggered by a push that changes harness/idle_study/run.json:
#   {"nonce": <anything>, "only": ["name", ...] (empty = every repository in repos.json), "runs": null | N}
# Each repository runs in its own job; results are committed to harness/idle_study/results/<name>.json.

on:
  push:
    branches: [claude/loving-maxwell-58mv2w]
    paths: [harness/idle_study/run.json]

permissions:
  contents: write

concurrency:
  group: idle-study-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          cd harness/idle_study
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          run = json.load(open("run.json"))
          repos = json.load(open("repos.json"))
          only = run.get("only") or list(repos)
          inc = []
          for n in only:
              c = repos[n]
              inc.append({"name": n, "python": c.get("python", ""), "node": c.get("node", ""),
                          "bun": c.get("bun", ""), "free_disk": bool(c.get("free_disk"))})
          print("matrix=" + json.dumps({"include": inc}))
          EOF

  study:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_ENABLE_STRICT: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: fenvix
      - name: free disk space
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/.ghcup || true
          df -h /
      - uses: actions/setup-python@v5
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.node != ''
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun != ''
        with:
          bun-version: ${{ matrix.bun }}
      - uses: astral-sh/setup-uv@v6
      - name: measure
        run: |
          RO=$(jq -r '.runs // empty' fenvix/harness/idle_study/run.json)
          if [ -n "$RO" ]; then export RUNS_OVERRIDE=$RO; else unset RUNS_OVERRIDE; fi
          export BUDGET_MIN=$(jq -r '.budget_min // 270' fenvix/harness/idle_study/run.json)
          bash fenvix/harness/idle_study/lib/run_repo.sh "${{ matrix.name }}"
      - name: commit result
        if: always()
        run: |
          set -u
          f="fenvix/harness/idle_study/results/${{ matrix.name }}.json"
          if [ ! -f "$f" ]; then
            jq -n --arg n "${{ matrix.name }}" '{name:$n, status:"job_failed", run_id: env.GITHUB_RUN_ID}' > "$f"
          fi
          cp "$f" /tmp/result.json
          cd fenvix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 40); do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME" && git checkout -q -f -B pub FETCH_HEAD || { sleep 5; continue; }
            mkdir -p harness/idle_study/results
            cp /tmp/result.json "harness/idle_study/results/${{ matrix.name }}.json"
            git add "harness/idle_study/results/${{ matrix.name }}.json"
            git commit -q -m "idle-study: result for ${{ matrix.name }} (run ${GITHUB_RUN_ID})" || exit 0
            git push -q origin "pub:$GITHUB_REF_NAME" && exit 0
            sleep $(( (RANDOM % 20) + 5 ))
          done
          exit 1
