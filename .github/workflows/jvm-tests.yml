name: jvm-tests

# JVM shell: build (Rust core JNI + agent), engine tests, control tests (Gradle and
# Maven, JUnit 5 and JUnit 4) on Java 11, 17 and 21, skip-key tests, Level 1
# measurement (threads, Kotlin coroutines). Results are committed under
# jvm/test/results/ci/ on the branch.

on:
  workflow_dispatch:
  push:
    branches: [claude/jvm-l0]
    paths: [jvm/**, crates/fenvix-jvm/**, crates/detpy-core/**, .github/workflows/jvm-tests.yml]

permissions:
  contents: write

concurrency:
  group: jvm-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: cargo test -p detpy-core -p fenvix-jvm 2>&1 | tail -20
      - run: ./jvm/build.sh
      - uses: actions/upload-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist/fenvix-agent.jar}

  controls:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - uses: actions/download-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist}
      - name: control tests
        run: |
          export JAVA_HOME=$JAVA_HOME_${{ matrix.java }}_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          python3 jvm/test/run_controls.py --out jvm/test/results/ci/controls-java${{ matrix.java }}.json | tee jvm/test/results/ci/controls-java${{ matrix.java }}.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "controls-${{ matrix.java }}", path: "jvm/test/results/"}

  skipkeys:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - uses: actions/download-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist}
      - run: pip install blake3
      - run: python3 jvm/test/run_skipkeys.py --out jvm/test/results/ci/skipkeys.json | tee jvm/test/results/ci/skipkeys.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: skipkeys, path: "jvm/test/results/"}

  l1-measure:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - uses: actions/download-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist}
      - run: python3 jvm/test/run_l1_measure.py --runs 10 --out jvm/test/results/ci/l1-measure.json | tee jvm/test/results/ci/l1-measure.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: l1-measure, path: "jvm/test/results/"}

  commit:
    if: always()
    needs: [controls, skipkeys, l1-measure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: art}
      - name: commit results
        run: |
          mkdir -p jvm/test/results/ci
          for d in art/controls-* art/skipkeys art/l1-measure; do [ -d "$d/ci" ] && cp -r $d/ci/* jvm/test/results/ci/ || true; done
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > jvm/test/results/ci/RUN.txt
          git config user.name "fenvix-ci"; git config user.email "ci@fenvix.invalid"
          git add jvm/test/results/ci
          git commit -m "JVM tests: results of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); done
