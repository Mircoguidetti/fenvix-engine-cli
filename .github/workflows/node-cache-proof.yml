name: node-cache-proof

# detjs --det-cache (skip with proof for Vitest / Jest), measured over windows of 51 commits.
#   build  -> detjs native core (napi-rs)
#   tests  -> Rust core tests + the cache tests (node/test/cache.test.js, review r021 tests) on Vitest and Jest
#   walk   -> one job per (repository, shard): per commit a skip run, a verify run (every would-be reuse checked by
#             a fresh run at the same commit), overhead runs, Nx affected; results committed to the branch
# Started by a push that changes harness/node_cache/RUN (JSON: {"label": "...", "repos": [...], "tests": true}).
# With "before": "<commit>" and "ab_repos": [...], the walks of those repositories also time cold captures of the
# engine at that commit against this one at their overhead commits (same machine, alternating; walk.py capture_ab).

on:
  workflow_dispatch:
    inputs:
      config: {description: "JSON parameters (see harness/node_cache/RUN)", default: "{}"}
  push:
    branches: [claude/node-cache-proof]
    paths: [harness/node_cache/RUN]

permissions:
  contents: write

concurrency:
  group: node-cache-proof-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      label: ${{ steps.c.outputs.label }}
      tests: ${{ steps.c.outputs.tests }}
      before: ${{ steps.c.outputs.before }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          DISPATCH: ${{ inputs.config }}
        run: |
          python3 - <<'PY'
          import json, os
          d = {"label": "run", "repos": ["docusaurus", "vue-core", "lexical", "react-native"], "tests": True, "shards": {}, "windows": {}}
          try:
              d.update(json.load(open("harness/node_cache/RUN")))
          except Exception as e:
              print("RUN:", e)
          d.update(json.loads(os.environ.get("DISPATCH") or "{}"))
          inc = []
          for r in d["repos"]:
              spec = json.load(open(f"harness/node_cache/specs/{r}.json"))
              n = int(d["shards"].get(r, spec.get("shards", 1)))
              for k in range(n):
                  w = d["windows"].get(r)
                  inc.append({"repo": r, "shard": k, "nshards": n, "node": spec["node"], "window": f"{w[0]}:{w[1]}" if w else "",
                              "ab": bool(d.get("before")) and r in d.get("ab_repos", [])})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': inc})}\n")
              f.write(f"label={d['label']}\n")
              f.write(f"tests={'true' if d['tests'] else 'false'}\n")
              f.write(f"before={d.get('before', '')}\n")
          print(d, inc)
          PY

  build:
    needs: [config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cargo build -p detpy-node --release
      - run: cp target/release/libdetpy_node.so node/detjs.linux-x64.node
      - uses: actions/upload-artifact@v4
        with:
          name: detjs
          path: node/detjs.linux-x64.node
      # an earlier engine for the capture A/B (RUN "before": a commit of this repository)
      - name: earlier engine
        if: needs.config.outputs.before != ''
        run: |
          git worktree add -q /tmp/before ${{ needs.config.outputs.before }}
          (cd /tmp/before && cargo build -p detpy-node --release && cp target/release/libdetpy_node.so node/detjs.linux-x64.node)
          tar -C /tmp/before -czf /tmp/detjs-before.tgz node/src node/bin node/package.json node/detjs.linux-x64.node
      - uses: actions/upload-artifact@v4
        if: needs.config.outputs.before != ''
        with:
          name: detjs-before
          path: /tmp/detjs-before.tgz

  tests:
    needs: [config, build]
    if: needs.config.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with: {name: detjs, path: node}
      - run: cargo test -p detpy-core
      - name: cache tests (Vitest and Jest)
        run: |
          cd node && npm ci
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../cache-tests.xml test/cache.test.js test/review-r021.test.js test/r021-fixes.test.js test/review-r021b.test.js test/r021b-fixes.test.js 2>&1 | tee ../cache-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-tests
          path: |
            cache-tests.log
            cache-tests.xml

  walk:
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/download-artifact@v4
        with: {name: detjs, path: node}
      - uses: actions/download-artifact@v4
        if: matrix.ab
        with: {name: detjs-before, path: /tmp}
      - name: earlier engine
        if: matrix.ab
        run: mkdir -p /tmp/before && tar -C /tmp/before -xzf /tmp/detjs-before.tgz && ls /tmp/before/node
      - name: clone
        run: |
          URL=$(python3 -c "import json;print(json.load(open('harness/node_cache/specs/${{ matrix.repo }}.json'))['url'])")
          git clone -q "$URL" /tmp/repo
          echo "runner: $RUNNER_NAME $(nproc) cpus; $(grep -m1 'model name' /proc/cpuinfo)"
      - name: walk
        run: |
          mkdir -p /tmp/out
          python3 harness/node_cache/walk.py --spec harness/node_cache/specs/${{ matrix.repo }}.json \
            --repo /tmp/repo --work /tmp/work --out /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json \
            --commits harness/node_cache/commits/${{ matrix.repo }}-commits.json \
            --shard ${{ matrix.shard }} --nshards ${{ matrix.nshards }} --budget 18600 --run-timeout 3000 \
            ${{ matrix.window && format('--window={0}', matrix.window) || '' }} \
            ${{ matrix.ab && '--engine-before=/tmp/before' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ matrix.repo }}-${{ matrix.shard }}
          path: /tmp/out/
      - name: commit results
        if: always()
        run: |
          D=harness/node_cache/results/${{ needs.config.outputs.label }}
          mkdir -p $D
          [ -f /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json ] || exit 0
          gzip -c /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json > $D/${{ matrix.repo }}-${{ matrix.shard }}.json.gz
          git config user.name "fenvix-harness"
          git config user.email "harness@users.noreply.github.com"
          git add $D
          git commit -q -m "node cache proof: ${{ matrix.repo }} shard ${{ matrix.shard }} (${{ needs.config.outputs.label }}) from run ${{ github.run_id }}"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 7))
          done
