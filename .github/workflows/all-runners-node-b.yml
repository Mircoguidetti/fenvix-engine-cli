name: all-runners-node-b

# detjs shells for tap, AVA, Jasmine and uvu (node/src/runners/): control and wrong-reuse tests, then walks of real
# repositories with --det --det-cache (skip run from the previous commit's cache + verify run comparing every
# would-be reuse with a fresh result; harness/node_cache/walk.py).
#   build  -> detjs native core (napi-rs)
#   tests  -> node/test/runner-{tap,ava,jasmine,uvu}.test.js (runners installed pinned by the tests) and the shared
#             cache suites of Vitest and Jest (the capture changed: they must still pass)
#   walk   -> one job per (repository, shard); results committed to the branch
# Started by a push that changes harness/node_cache/RUN-node-b (JSON: {"label": "...", "repos": [...], "tests": true}).

on:
  workflow_dispatch:
    inputs:
      config: {description: "JSON parameters (see harness/node_cache/RUN-node-b)", default: "{}"}
  push:
    branches: [claude/all-runners]
    paths: [harness/node_cache/RUN-node-b]

permissions:
  contents: write

concurrency:
  group: all-runners-node-b-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      label: ${{ steps.c.outputs.label }}
      tests: ${{ steps.c.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          DISPATCH: ${{ inputs.config }}
        run: |
          python3 - <<'PY'
          import json, os
          d = {"label": "nb", "repos": ["tap-minimatch", "tap-dotenv", "ava-globby", "ava-shelljs", "jasmine-cordova-android",
               "jasmine-xregexp", "uvu-autoprefixer", "uvu-browserslist"], "tests": True, "shards": {}, "windows": {}}
          try:
              d.update(json.load(open("harness/node_cache/RUN-node-b")))
          except Exception as e:
              print("RUN-node-b:", e)
          d.update(json.loads(os.environ.get("DISPATCH") or "{}"))
          inc = []
          for r in d["repos"]:
              spec = json.load(open(f"harness/node_cache/specs/{r}.json"))
              n = int(d["shards"].get(r, spec.get("shards", 1)))
              for k in range(n):
                  w = d["windows"].get(r)
                  inc.append({"repo": r, "shard": k, "nshards": n, "node": spec["node"], "window": f"{w[0]}:{w[1]}" if w else ""})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': inc})}\n")
              f.write(f"label={d['label']}\n")
              f.write(f"tests={'true' if d['tests'] else 'false'}\n")
          print(d, inc)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cargo build -p detpy-node --release
      - run: cp target/release/libdetpy_node.so node/detjs.linux-x64.node
      - uses: actions/upload-artifact@v4
        with:
          name: detjs
          path: node/detjs.linux-x64.node

  tests:
    needs: [config, build]
    if: needs.config.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: [tap, ava, jasmine, uvu, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with: {name: detjs, path: node}
      - name: tests (${{ matrix.suite }})
        run: |
          cd node
          if [ "${{ matrix.suite }}" = shared ]; then
            npm ci
            FILES="test/cache.test.js test/review-r021.test.js test/r021-fixes.test.js"
          else
            FILES="test/runner-${{ matrix.suite }}.test.js"
          fi
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../tests-${{ matrix.suite }}.xml $FILES 2>&1 | tee ../tests-${{ matrix.suite }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: |
            tests-${{ matrix.suite }}.log
            tests-${{ matrix.suite }}.xml

  walk:
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/download-artifact@v4
        with: {name: detjs, path: node}
      - name: clone
        run: |
          URL=$(python3 -c "import json;print(json.load(open('harness/node_cache/specs/${{ matrix.repo }}.json'))['url'])")
          git clone -q "$URL" /tmp/repo
          echo "runner: $RUNNER_NAME $(nproc) cpus; $(grep -m1 'model name' /proc/cpuinfo)"
      - name: walk
        run: |
          mkdir -p /tmp/out
          python3 harness/node_cache/walk.py --spec harness/node_cache/specs/${{ matrix.repo }}.json \
            --repo /tmp/repo --work /tmp/work --out /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json \
            --commits harness/node_cache/commits/${{ matrix.repo }}-commits.json \
            --shard ${{ matrix.shard }} --nshards ${{ matrix.nshards }} --budget 18600 --run-timeout 3000 \
            ${{ matrix.window && format('--window={0}', matrix.window) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ matrix.repo }}-${{ matrix.shard }}
          path: /tmp/out/
      - name: commit results
        if: always()
        run: |
          D=harness/node_cache/results/${{ needs.config.outputs.label }}
          mkdir -p $D
          [ -f /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json ] || exit 0
          gzip -c /tmp/out/${{ matrix.repo }}-${{ matrix.shard }}.json > $D/${{ matrix.repo }}-${{ matrix.shard }}.json.gz
          git config user.name "fenvix-harness"
          git config user.email "harness@users.noreply.github.com"
          git add $D
          git commit -q -m "all runners (node-b): ${{ matrix.repo }} shard ${{ matrix.shard }} (${{ needs.config.outputs.label }}) from run ${{ github.run_id }}"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 7))
          done
