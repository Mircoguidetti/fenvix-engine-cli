name: skip-study2

# Skip-with-proof study 2 (harness/skip_study2/). Triggered by a push that changes harness/skip_study2/run.json.
#   plan   -> job matrices from run.json
#   walk   -> one job per (repository, shard): commit walk with dependency capture (walk.py)
#   flaky  -> one job per (repository, CI test group, repetition): the project's own CI test step at a pinned
#             commit (flaky.py)
# Every job commits its JSON result to harness/skip_study2/results/<run_id>/ with rebase-retry.

on:
  push:
    branches: [claude/loving-maxwell-58mv2w]
    paths: [harness/skip_study2/run.json, harness/skip_study2/headtohead/run.json]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  S2_COMMIT: "1"
  S2_BRANCH: claude/loving-maxwell-58mv2w
  GOTOOLCHAIN: auto
  UV_PYTHON_PREFERENCE: managed

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      walk: ${{ steps.p.outputs.walk }}
      flaky: ${{ steps.p.outputs.flaky }}
      has_walk: ${{ steps.p.outputs.has_walk }}
      has_flaky: ${{ steps.p.outputs.has_flaky }}
      finer: ${{ steps.p.outputs.finer }}
      agent: ${{ steps.p.outputs.agent }}
      has_agent: ${{ steps.p.outputs.has_agent }}
      has_finer: ${{ steps.p.outputs.has_finer }}
      recheck: ${{ steps.p.outputs.recheck }}
      has_recheck: ${{ steps.p.outputs.has_recheck }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 50}
      - id: p
        # plan only when this push changed harness/skip_study2/run.json (a head-to-head push must not re-run it)
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx harness/skip_study2/run.json; then
            python3 harness/skip_study2/plan.py
          else
            echo "harness/skip_study2/run.json unchanged: nothing planned"
          fi

  walk:
    needs: plan
    if: ${{ needs.plan.outputs.has_walk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.walk) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.lang == 'go' }}
        uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: System packages and services
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace ${{ matrix.apt }} > /dev/null
          for s in ${{ matrix.services }}; do
            case $s in
              postgres) docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=saleor -e POSTGRES_PASSWORD=saleor postgres:15-alpine ;;
              valkey) docker run -d --name vk -p 6379:6379 valkey/valkey:8.1-alpine ;;
            esac
          done
          strace -V | head -1
      - name: Walk
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          shard_tag=$(echo "${{ matrix.shard }}" | tr / of)
          python3 harness/skip_study2/walk.py --spec "${{ matrix.spec }}" --work "$RUNNER_TEMP/w" \
            --out "harness/skip_study2/results/${{ needs.plan.outputs.run_id }}/walk/${{ matrix.name }}-${shard_tag}.json.gz" \
            --shard "${{ matrix.shard }}" --budget-min "${{ matrix.budget }}" --run-id "${{ needs.plan.outputs.run_id }}"

  agent:
    needs: plan
    if: ${{ needs.plan.outputs.has_agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.agent) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.lang == 'go' }}
        uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: System packages and services
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace ${{ matrix.apt }} > /dev/null
          for s in ${{ matrix.services }}; do
            case $s in
              postgres) docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=saleor -e POSTGRES_PASSWORD=saleor postgres:15-alpine ;;
              valkey) docker run -d --name vk -p 6379:6379 valkey/valkey:8.1-alpine ;;
            esac
          done
          strace -V | head -1
      - name: Walk agent pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          extra=""
          if [ -n "${{ matrix.sample }}" ]; then extra="--sample ${{ matrix.sample }}"; fi
          python3 harness/skip_study2/agent_walk.py --spec "${{ matrix.spec }}" --query "${{ matrix.query }}" \
            --label "${{ matrix.label }}" --max-prs "${{ matrix.max_prs }}" $extra --work "$RUNNER_TEMP/w" \
            --budget-min "${{ matrix.budget }}" \
            --out "harness/skip_study2/results/${{ needs.plan.outputs.run_id }}/agent/${{ matrix.name }}-${{ matrix.label }}.json.gz"

  flaky:
    needs: plan
    if: ${{ needs.plan.outputs.has_flaky == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.flaky) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.lang == 'go' }}
        uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: System packages and services
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace ${{ matrix.apt }} > /dev/null
          for s in ${{ matrix.services }}; do
            case $s in
              postgres) docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=saleor -e POSTGRES_PASSWORD=saleor postgres:15-alpine ;;
              valkey) docker run -d --name vk -p 6379:6379 valkey/valkey:8.1-alpine ;;
            esac
          done
          strace -V | head -1
      - name: CI test step
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          g=$(echo "${{ matrix.group }}" | tr / of)
          python3 harness/skip_study2/flaky.py --spec "${{ matrix.spec }}" --sha "${{ matrix.sha }}" \
            --group "${{ matrix.group }}" --rep "${{ matrix.rep }}" --work "$RUNNER_TEMP/f" \
            --out "harness/skip_study2/results/${{ needs.plan.outputs.run_id }}/flaky/${{ matrix.name }}-g${g}-r${{ matrix.rep }}.json"

  finer:
    needs: plan
    if: ${{ needs.plan.outputs.has_finer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.finer) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - name: Capture (51 commits) and analysis with the name-read rule
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          python3 -m venv "$RUNNER_TEMP/drv" && "$RUNNER_TEMP/drv/bin/pip" install -q coverage
          out="harness/skip_study2/results/${{ needs.plan.outputs.run_id }}/finer"
          "$RUNNER_TEMP/drv/bin/python" harness/skip_study2/finer/run_repo.py --repo "${{ matrix.name }}" \
            --work "$RUNNER_TEMP/w" --commits 51 --sha "${{ matrix.sha }}" > "$RUNNER_TEMP/collect.log" 2>&1 || true
          tail -60 "$RUNNER_TEMP/collect.log"
          "$RUNNER_TEMP/drv/bin/python" harness/skip_study2/finer/analyze.py --repo "${{ matrix.name }}" \
            --work "$RUNNER_TEMP/w" --out "$out" | tail -60
          gzip -9 -f "$out/${{ matrix.name }}.json"
          python3 -c "import sys; sys.path.insert(0, 'harness/skip_study2'); import walk, pathlib; walk.commit_results([pathlib.Path('$out/${{ matrix.name }}.json.gz')], 'Skip study 2 (finer rule): ${{ matrix.name }}')"

  recheck:
    needs: plan
    if: ${{ needs.plan.outputs.has_recheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.recheck) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.lang == 'go' }}
        uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: System packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace ${{ matrix.apt }} > /dev/null
      - name: Re-check a verification mismatch
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          pr=""
          if [ -n "${{ matrix.pr }}" ]; then pr="--pr ${{ matrix.pr }}"; fi
          units=""
          for u in ${{ matrix.units }}; do units="$units --unit $u"; done
          python3 harness/skip_study2/recheck.py --spec "${{ matrix.spec }}" $pr --rec "${{ matrix.rec }}" \
            --cur "${{ matrix.cur }}" $units --work "$RUNNER_TEMP/r" \
            --out "harness/skip_study2/results/${{ needs.plan.outputs.run_id }}/recheck/${{ matrix.name }}-${{ matrix.idx }}.json"

  # Head-to-head (harness/skip_study2/headtohead/): rules A (coverage shape), B / B+ (files-read shape) and C (closure
  # v3) on the same commits, each with its own cache. Triggered by a push that changes headtohead/run.json.
  h2hplan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      h2h: ${{ steps.p.outputs.h2h }}
      has_h2h: ${{ steps.p.outputs.has_h2h }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 50}
      - id: p
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx harness/skip_study2/headtohead/run.json; then
            python3 harness/skip_study2/headtohead/plan.py
          else
            echo "headtohead/run.json unchanged: nothing planned"
          fi

  h2h:
    needs: h2hplan
    if: ${{ needs.h2hplan.outputs.has_h2h == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.h2hplan.outputs.h2h) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - name: System packages, services, locale
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace locales ${{ matrix.apt }} > /dev/null
          sudo locale-gen en_US.UTF-8 > /dev/null || true
          locale -a | head -5
          for s in ${{ matrix.services }}; do
            case $s in
              postgres) docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=saleor -e POSTGRES_PASSWORD=saleor postgres:15-alpine ;;
              valkey) docker run -d --name vk -p 6379:6379 valkey/valkey:8.1-alpine ;;
            esac
          done
      - name: Head-to-head walk
        run: |
          git config user.name "skip-study2-bot"
          git config user.email "skip-study2-bot@users.noreply.github.com"
          sudo chmod a+rwx /root || true
          shard_tag=$(echo "${{ matrix.shard }}" | tr / o)
          out="harness/skip_study2/headtohead/results/${{ needs.h2hplan.outputs.run_id }}"
          for spec in ${{ matrix.spec }}; do
            name=$(basename "$spec" .json)
            for arm in ${{ matrix.arms }}; do
              if [ "$arm" = main ]; then
                python3 harness/skip_study2/headtohead/h2h_walk.py --spec "$spec" --work "$RUNNER_TEMP/w-$arm" \
                  --out "$out/$name-main-${shard_tag}.json.gz" --shard "${{ matrix.shard }}" \
                  --budget-min "${{ matrix.budget }}" --run-id "${{ needs.h2hplan.outputs.run_id }}" || true
              else
                python3 harness/skip_study2/headtohead/h2h_walk.py --spec "$spec" --work "$RUNNER_TEMP/w-$arm" \
                  --out "$out/$name-$arm-${shard_tag}.json.gz" --shard "${{ matrix.shard }}" --arm "$arm" \
                  --max-commits "${{ matrix.arm_commits }}" --budget-min "${{ matrix.arm_budget }}" \
                  --run-id "${{ needs.h2hplan.outputs.run_id }}" || true
              fi
              rm -rf "$RUNNER_TEMP/w-$arm"
            done
          done
