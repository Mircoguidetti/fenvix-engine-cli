name: dep-verdict

# Dependency-update verdict validation (harness/dep_verdict/). Triggered by a push that changes
# harness/dep_verdict/run.json on this branch. The engine is this branch at the triggering commit.
#   build -> detpy wheel, job matrix from run.json
#   ci    -> the projects' own CI verdict on every dependency-only commit and its parent (ci_status.py)
#   pairs -> one job per (spec, shard): harness/dep_verdict/pairs.py; results committed (rebase-retry) to
#            harness/dep_verdict/results/<run_id>/

on:
  push:
    branches: [claude/dep-verdict-abjcfw]
    paths: [harness/dep_verdict/run.json]

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  UV_PYTHON_PREFERENCE: managed
  DV_COMMIT: "1"
  DV_BRANCH: claude/dep-verdict-abjcfw

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      pairs: ${{ steps.p.outputs.pairs }}
      ci: ${{ steps.p.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install maturin
      - run: maturin build --release --compatibility linux -o dist
      - uses: actions/upload-artifact@v4
        with: {name: wheel, path: dist/*.whl}
      - id: p
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          run = json.load(open("harness/dep_verdict/run.json"))
          rows = []
          for w in run.get("pairs", []):
              spec = json.load(open(f"harness/dep_verdict/specs/{w['spec']}.json"))
              n = w.get("shards", 1)
              for s in range(n):
                  if w.get("only_shards") and s not in w["only_shards"]:
                      continue
                  rows.append({"spec": w["spec"], "shard": f"{s}/{n}", "tag": f"{s}of{n}",
                               "budget": w.get("budget_min", 330), "only": w.get("only", ""),
                               "max_units": w.get("max_units", 0), "apt": " ".join(spec.get("apt", []))})
          print("run_id=" + run["run_id"])
          print("pairs=" + json.dumps(rows))
          print("ci=" + ("true" if run.get("ci") else "false"))
          PY

  ci:
    needs: build
    if: ${{ needs.build.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI status of the dependency-only commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dep-verdict-bot"
          git config user.email "dep-verdict-bot@users.noreply.github.com"
          out="harness/dep_verdict/results/${{ needs.build.outputs.run_id }}/ci-status.json"
          mkdir -p "$(dirname "$out")"
          python3 harness/dep_verdict/ci_status.py --commits harness/dep_verdict/commits.json --out "$out"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$DV_BRANCH" && git reset -q --soft "origin/$DV_BRANCH" && git reset -q
            git add -f "$out" && git commit -q -m "dep-verdict: CI status (${{ needs.build.outputs.run_id }})" || exit 0
            git push -q origin "HEAD:$DV_BRANCH" && exit 0
            sleep $((5 + RANDOM % 20))
          done

  pairs:
    needs: build
    if: ${{ needs.build.outputs.pairs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJSON(needs.build.outputs.pairs) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: {name: wheel, path: "${{ runner.temp }}/dist"}
      - name: System packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace ${{ matrix.apt }} > /dev/null
          strace -V | head -1
      - name: Pairs
        run: |
          git config user.name "dep-verdict-bot"
          git config user.email "dep-verdict-bot@users.noreply.github.com"
          git config --global user.name "dep-verdict-bot"
          git config --global user.email "dep-verdict-bot@users.noreply.github.com"
          python3 harness/dep_verdict/pairs.py --spec "harness/dep_verdict/specs/${{ matrix.spec }}.json" \
            --commits harness/dep_verdict/commits.json --work "$RUNNER_TEMP/w" \
            --wheel "$(ls $RUNNER_TEMP/dist/*.whl)" --shard "${{ matrix.shard }}" --budget-min "${{ matrix.budget }}" \
            --only "${{ matrix.only }}" --max-units "${{ matrix.max_units }}" \
            --out "harness/dep_verdict/results/${{ needs.build.outputs.run_id }}/${{ matrix.spec }}-${{ matrix.tag }}.json.gz"
