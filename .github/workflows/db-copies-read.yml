name: db-copies-read

# db-copies-read (harness/db_copies_read/): GET-only reads of public repository data with this workflow's
# GITHUB_TOKEN. A run starts when a push to this branch adds a request file harness/db_copies_read/requests/<n>.json;
# only request files added by the push are processed (git diff --diff-filter=A before..sha). After a successful job
# the workflow commits the results files to this branch only, under its bot name (founder "bot ok", 2026-11-26;
# a push made with GITHUB_TOKEN does not start another run). The work session pulls them with git.

on:
  push:
    branches: [claude/db-copies-read]
    paths:
      - harness/db_copies_read/requests/**

permissions:
  contents: write
  actions: read

concurrency:
  group: db-copies-read
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Request files added by this push
        id: req
        run: |
          mkdir -p "$RUNNER_TEMP/req"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          git diff --name-only --diff-filter=A "$before" "${{ github.sha }}" -- harness/db_copies_read/requests/ \
            | sort | while read -r f; do cp "$f" "$RUNNER_TEMP/req/"; echo "request: $f"; done
          n=$(ls -1 "$RUNNER_TEMP/req" | sort -n | tail -1 | sed 's/\.json$//')
          echo "n=${n:-none}" >> "$GITHUB_OUTPUT"
          ls -1 "$RUNNER_TEMP/req"
      - name: Read
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in $(ls -1 "$RUNNER_TEMP/req" | sort -n); do
            echo "== $f"; cat "$RUNNER_TEMP/req/$f"
            python3 harness/db_copies_read/job.py --request "$RUNNER_TEMP/req/$f"
          done
      - name: Commit results to this branch
        run: |
          git config user.name "db-copies-read-bot"
          git config user.email "db-copies-read-bot@users.noreply.github.com"
          out=harness/db_copies_read/results
          [ -f "$out/checkpoint.json" ] || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin claude/db-copies-read && git reset -q --soft origin/claude/db-copies-read && git reset -q
            git add -f "$out/raw" "$out/requests.log" "$out/chunks.jsonl" "$out/checkpoint.json"
            [ -d "$out/docs" ] && git add -f "$out/docs"
            git commit -q -m "db-copies-read: results (run ${{ github.run_id }})" || exit 0
            git push -q origin "HEAD:claude/db-copies-read" && exit 0
            sleep $((5 + RANDOM % 20))
          done
          exit 1
