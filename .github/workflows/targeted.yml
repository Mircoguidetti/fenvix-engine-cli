# Targeted runs while working: a push to a session branch runs only the tests its changed paths need
# (release/ci/affected.py documents the mapping; any path without a rule runs everything). Python on 3.13, Node on 22.
# This is a convenience, never the gate: a pull request into claude/release-1 always runs the complete sharded suite on
# every version (release-1.yml), and a branch that already has an open pull request is left to that gate.
name: targeted

on:
  push:
    branches: ["claude/**", "!claude/release-1"]

concurrency:
  group: targeted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: changed paths and the tests they need
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base claude/release-1 --state open --json number --jq 'length')"
          if [ "$open" != 0 ]; then echo "an open pull request runs the full gate: nothing to do here"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin claude/release-1
          base="$(git merge-base origin/claude/release-1 HEAD)"
          git diff --name-only "$base" HEAD > changed.txt
          python3 release/ci/affected.py - < changed.txt | tee affected.json
          python3 -c "import json; a=json.load(open('affected.json')); print('py=' + ('all' if a['python']=='all' else ' '.join(a['python']))); print('node=' + ('all' if a['node']=='all' else ' '.join(a['node'])))" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.skip == '0' && (steps.plan.outputs.py != '' || steps.plan.outputs.node != '')
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.skip == '0' && steps.plan.outputs.node != ''
        with: {node-version: "22"}
      - name: build the wheel and the addon
        if: steps.plan.outputs.skip == '0' && (steps.plan.outputs.py != '' || steps.plan.outputs.node != '')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          pip install -q "maturin>=1.5,<2" pytest pytest-xdist && maturin build --release -o dist -q
          pip install -q --no-deps dist/fenvix-*.whl && cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
          cargo build -q -p detpy-node --release && cp target/release/libdetpy_node.so node/detjs.linux-x64.node
      - name: Python tests the change needs
        if: steps.plan.outputs.skip == '0' && steps.plan.outputs.py != ''
        run: |
          if [ "${{ steps.plan.outputs.py }}" = all ]; then sel=(tests); else read -ra sel <<< "${{ steps.plan.outputs.py }}"; fi
          python -m pytest -q -p no:randomly -rfE "${sel[@]}" \
            --deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does
      - name: Node tests the change needs
        if: steps.plan.outputs.skip == '0' && steps.plan.outputs.node != ''
        working-directory: node
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ steps.plan.outputs.node }}" = all ]; then sel=(test/*.test.js); else read -ra sel <<< "${{ steps.plan.outputs.node }}"; fi
          node --test --test-concurrency=1 "${sel[@]}"
