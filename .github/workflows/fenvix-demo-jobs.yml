name: fenvix-demo-jobs

# Reusable body of the `runs-on: fenvix` demo: two jobs, one per commit of a public pytest project, on the same
# machine, with the cache with proof kept on that machine between them. The second job runs only the tests whose
# inputs changed, reuses the others with a receipt, then checks every reuse against a full run without the cache.
#
# Called by fenvix-demo.yml (runs-on: [self-hosted, fenvix], our machine) and fenvix-demo-hosted.yml (a GitHub-hosted
# rehearsal: there the "machine disk" is carried between the two jobs as an artifact, because two hosted jobs never
# share a machine). Never triggered by pull requests: see docs/RUNNER-PROTOTYPE.md, "Security".

on:
  workflow_call:
    inputs:
      runs_on: {type: string, required: true, description: "JSON for runs-on, e.g. '[\"self-hosted\",\"fenvix\"]'"}
      hosted: {type: boolean, default: false, description: "GitHub-hosted rehearsal: build the engine, carry the cache"}
      target: {type: string, default: "pallets/click"}
      commit_n: {type: string, default: "e38188e9e205005d5af5f9e59df51904c984586a"}
      commit_n1: {type: string, default: "08b803cf32ceb2ae6a772c62d5da42757a897d44"}
      python: {type: string, default: "3.13"}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UV_PYTHON_PREFERENCE: managed

jobs:
  engine:
    # Hosted only: our machine already has the engine (runner/bootstrap.sh builds it once into $FENVIX_WHEEL_DIR).
    if: inputs.hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ inputs.python }}"}
      - run: pip install "maturin>=1.5,<2" && maturin build --release --compatibility linux -o dist
      - uses: actions/upload-artifact@v4
        with: {name: fenvix-wheel, path: dist/*.whl, retention-days: 3}

  commit-n:
    needs: engine
    if: ${{ !cancelled() && (needs.engine.result == 'success' || needs.engine.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with: {path: engine}
      - uses: actions/checkout@v4
        with: {repository: "${{ inputs.target }}", ref: "${{ inputs.commit_n }}", path: target, fetch-depth: 1,
               persist-credentials: false}
      - name: uv
        run: |
          command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - name: Engine wheel (hosted rehearsal only; our machine has it in $FENVIX_WHEEL_DIR)
        if: inputs.hosted
        uses: actions/download-artifact@v4
        with: {name: fenvix-wheel, path: "${{ runner.temp }}/wheels"}
      - name: Project environment (project, its test requirements, the fenvix engine)
        run: |
          set -eu
          wheels="${FENVIX_WHEEL_DIR:-$RUNNER_TEMP/wheels}"
          uv venv -q --python "${{ inputs.python }}" "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          cd target
          if grep -q '^tests = ' pyproject.toml 2>/dev/null; then grp="--group tests"; else grp=""; fi
          uv pip install -q --python "$py" -e . $grp pytest
          uv pip install -q --python "$py" "$(ls "$wheels"/detpy-*.whl | head -1)"
          "$py" -c "import detpy, sys; print('detpy', detpy.__version__, 'python', sys.version.split()[0])"
          echo "FENVIX_PY=$py" >> "$GITHUB_ENV"
          if [ -z "${FENVIX_CACHE_ROOT:-}" ]; then echo "FENVIX_CACHE_ROOT=$RUNNER_TEMP/fenvix-cache" >> "$GITHUB_ENV"; fi
          command -v strace >/dev/null || sudo apt-get install -y -qq strace >/dev/null 2>&1 || echo "no strace: tests that start processes run every time"
      - id: key
        # One cache namespace per workflow run, so every demo starts cold at commit N and job 2 finds job 1's entries.
        # A real customer job uses the project key alone and keeps one warm cache for every run.
        run: echo "key=${{ inputs.target }}@demo-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Tests in the fenvix engine (commit N, cold cache)
        run: >
          "$FENVIX_PY" engine/runner/fenvix-run --project target --python "$FENVIX_PY" --key "${{ steps.key.outputs.key }}"
          --out "$RUNNER_TEMP/fenvix" --title "fenvix · ${{ inputs.target }} @ commit N"
      - name: Receipts and summary
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "fenvix-receipts-${{ github.job }}", path: "${{ runner.temp }}/fenvix", retention-days: 14}
      - name: Carry the machine's cache to job 2 (hosted rehearsal only)
        if: inputs.hosted
        uses: actions/upload-artifact@v4
        with: {name: fenvix-machine-cache, path: "${{ runner.temp }}/fenvix-cache", retention-days: 1,
               include-hidden-files: true}

  commit-n1:
    needs: commit-n
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {path: engine}
      - uses: actions/checkout@v4
        with: {repository: "${{ inputs.target }}", ref: "${{ inputs.commit_n1 }}", path: target, fetch-depth: 1,
               persist-credentials: false}
      - name: uv
        run: |
          command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
      - name: Engine wheel (hosted rehearsal only; our machine has it in $FENVIX_WHEEL_DIR)
        if: inputs.hosted
        uses: actions/download-artifact@v4
        with: {name: fenvix-wheel, path: "${{ runner.temp }}/wheels"}
      - name: Project environment (project, its test requirements, the fenvix engine)
        run: |
          set -eu
          wheels="${FENVIX_WHEEL_DIR:-$RUNNER_TEMP/wheels}"
          uv venv -q --python "${{ inputs.python }}" "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          cd target
          if grep -q '^tests = ' pyproject.toml 2>/dev/null; then grp="--group tests"; else grp=""; fi
          uv pip install -q --python "$py" -e . $grp pytest
          uv pip install -q --python "$py" "$(ls "$wheels"/detpy-*.whl | head -1)"
          "$py" -c "import detpy, sys; print('detpy', detpy.__version__, 'python', sys.version.split()[0])"
          echo "FENVIX_PY=$py" >> "$GITHUB_ENV"
          if [ -z "${FENVIX_CACHE_ROOT:-}" ]; then echo "FENVIX_CACHE_ROOT=$RUNNER_TEMP/fenvix-cache" >> "$GITHUB_ENV"; fi
          command -v strace >/dev/null || sudo apt-get install -y -qq strace >/dev/null 2>&1 || echo "no strace: tests that start processes run every time"
      - name: Restore the machine's cache (hosted rehearsal only)
        if: inputs.hosted
        uses: actions/download-artifact@v4
        with: {name: fenvix-machine-cache, path: "${{ runner.temp }}/fenvix-cache"}
      - name: Tests in the fenvix engine (commit N+1, warm cache)
        run: >
          "$FENVIX_PY" engine/runner/fenvix-run --project target --python "$FENVIX_PY" --key "${{ needs.commit-n.outputs.cache_key }}"
          --out "$RUNNER_TEMP/fenvix" --title "fenvix · ${{ inputs.target }} @ commit N+1"
      - name: Check every skip (full run at N+1 without the cache; wrong must be 0)
        run: >
          "$FENVIX_PY" engine/runner/fenvix-run verify --project target --python "$FENVIX_PY"
          --summary "$RUNNER_TEMP/fenvix/summary.json"
      - name: Receipts and summary
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "fenvix-receipts-${{ github.job }}", path: "${{ runner.temp }}/fenvix", retention-days: 14}
      - name: Drop this demo's cache namespace (our machine keeps only real project caches)
        if: always() && !inputs.hosted
        run: rm -rf "${FENVIX_CACHE_ROOT:?}"/*demo-${{ github.run_id }}-* || true
