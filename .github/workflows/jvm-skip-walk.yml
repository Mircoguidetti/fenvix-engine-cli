name: jvm-skip-walk

# Skip with proof over 50 commits of Java/Kotlin repositories, sharded; each shard commits its results.
# Started by a push that changes jvm/harness/WALK, or manually.

on:
  workflow_dispatch:
  push:
    branches: [claude/jvm-l0]
    paths: [jvm/harness/WALK]

permissions:
  contents: write

concurrency:
  group: jvm-skip-walk
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      commits: ${{ steps.c.outputs.commits }}
      shards: ${{ steps.c.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: python3 -c 'import json,os;c=json.load(open("jvm/harness/WALK"));f=open(os.environ["GITHUB_OUTPUT"],"a");[f.write(f"{k}={v}\n") for k,v in c.items()]'
      - id: m
        run: python3 jvm/harness/ci_walk.py matrix "${{ steps.c.outputs.repos }}" ${{ steps.c.outputs.shards }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./jvm/build.sh
      - uses: actions/upload-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist/fenvix-agent.jar}

  walk:
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
      - uses: actions/download-artifact@v4
        with: {name: fenvix-agent, path: jvm/dist}
      - run: pip install blake3
      - name: walk
        run: |
          repo=${MATRIX_JOB%%:*}; shard=${MATRIX_JOB##*:}
          python3 jvm/harness/skip_walk.py --repo $repo --shard $shard --shards ${{ needs.config.outputs.shards }} --commits ${{ needs.config.outputs.commits }}
        env:
          MATRIX_JOB: ${{ matrix.job }}
      - if: always()
        name: commit results
        env:
          MATRIX_JOB: ${{ matrix.job }}
        run: |
          repo=${MATRIX_JOB%%:*}; shard=${MATRIX_JOB##*:}
          gzip -f jvm/harness/results/skip/$repo/shard$shard.log || true
          git config user.name "fenvix-ci"; git config user.email "ci@fenvix.invalid"
          git add jvm/harness/results/skip/$repo
          git commit -m "JVM skip walk: $repo shard $shard (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin claude/jvm-l0 && git push -q origin HEAD:claude/jvm-l0 && break; sleep $((i*9)); done

  aggregate:
    if: always()
    needs: [walk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/jvm-l0}
      - run: python3 jvm/harness/ci_walk.py aggregate jvm/harness/results/skip
      - run: |
          git config user.name "fenvix-ci"; git config user.email "ci@fenvix.invalid"
          git add jvm/harness/results/skip/REPORT.md jvm/harness/results/skip/summary.json
          git commit -m "JVM skip walk: report (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin claude/jvm-l0 && git push -q origin HEAD:claude/jvm-l0 && break; sleep $((i*7)); done
