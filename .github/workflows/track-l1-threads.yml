name: track-l1-threads

# Track l1-threads (P-012): --det-threads (Level 1 for threads) measured on real projects.
# Triggered by a push that changes tracks/l1-threads/run.json:
#   {"nonce": "<results folder>", "only": ["corpus:anyio", "suite:flask"] (empty = every job),
#    "runs": 10, "seeds": 20, "confirm": 10, "timing_runs": 3, "loaded_runs": 5}
# The engine is the base commit plus tracks/l1-threads/patches (git am). Each job commits
# tracks/l1-threads/results/<nonce>/<name>.<kind>.json to this branch.

on:
  push:
    branches: [claude/loving-maxwell-58mv2w]
    paths: [tracks/l1-threads/run.json]

permissions:
  contents: write

concurrency:
  group: track-l1-threads-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  UV_PYTHON_PREFERENCE: managed
  BASE: 1573079b991c5b890b33670e6d753dc6898dbee8

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {path: brain}
      - name: engine = base + patches
        run: |
          git clone -q https://github.com/${{ github.repository }} engine
          cd engine
          git checkout -q "$BASE"
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git am -q ../brain/tracks/l1-threads/patches/*.patch
          git log --oneline -3 | cat
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install maturin
      - run: cd engine && maturin build --release --compatibility linux -o ../dist
      - name: pack
        run: |
          rm -rf engine/.git
          tar czf engine.tgz engine dist
      - uses: actions/upload-artifact@v4
        with: {name: engine, path: engine.tgz}
      - id: m
        run: |
          ONLY=$(jq -r '(.only // []) | join(",")' brain/tracks/l1-threads/run.json)
          echo "matrix=$(python3 engine/harness/l1_threads.py --list --only "$ONLY")" >> "$GITHUB_OUTPUT"

  tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: brain}
      - uses: actions/download-artifact@v4
        with: {name: engine}
      - run: tar xzf engine.tgz
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: engine tests
        run: |
          cd engine
          (cargo test -q -p detpy-core 2>&1 | tail -5) > ../tests.txt
          python -m venv .venv && . .venv/bin/activate
          pip install -q maturin pytest numpy requests pytest-benchmark
          maturin develop -q --release
          python -m pytest tests -q -p no:randomly 2>&1 | tail -25 >> ../tests.txt || true
          cat ../tests.txt
      - name: commit result
        if: always()
        run: |
          N=$(jq -r '.nonce' brain/tracks/l1-threads/run.json)
          cp tests.txt /tmp/tests.txt 2>/dev/null || echo "tests job failed" > /tmp/tests.txt
          cd brain
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 40); do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME" && git checkout -q -f -B pub FETCH_HEAD || { sleep 5; continue; }
            mkdir -p "tracks/l1-threads/results/$N"
            cp /tmp/tests.txt "tracks/l1-threads/results/$N/engine-tests.txt"
            git add "tracks/l1-threads/results/$N"
            git commit -q -m "l1-threads: engine tests ($N, run ${GITHUB_RUN_ID})" || exit 0
            git push -q origin "pub:$GITHUB_REF_NAME" && exit 0
            sleep $(( (RANDOM % 20) + 5 ))
          done
          exit 1

  measure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {path: brain}
      - uses: actions/download-artifact@v4
        with: {name: engine}
      - run: tar xzf engine.tgz
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - name: measure
        run: |
          R=brain/tracks/l1-threads/run.json
          python3 engine/harness/l1_threads.py --kind ${{ matrix.kind }} --project ${{ matrix.name }} \
            --wheel "$(ls dist/*.whl | head -1)" --work /tmp/l1t --out out \
            --runs "$(jq -r '.runs // 10' $R)" --seeds "$(jq -r '.seeds // 20' $R)" \
            --confirm "$(jq -r '.confirm // 10' $R)" --timing-runs "$(jq -r '.timing_runs // 3' $R)" \
            --loaded-runs "$(jq -r '.loaded_runs // 5' $R)" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: commit result
        if: always()
        run: |
          N=$(jq -r '.nonce' brain/tracks/l1-threads/run.json)
          F="${{ matrix.name }}.${{ matrix.kind }}.json"
          if [ ! -f "out/$F" ]; then
            mkdir -p out
            jq -n --arg n "${{ matrix.name }}" --arg k "${{ matrix.kind }}" '{name:$n, kind:$k, status:"job_failed", run_id: env.GITHUB_RUN_ID}' > "out/$F"
          fi
          cp "out/$F" /tmp/result.json
          cd brain
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 40); do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME" && git checkout -q -f -B pub FETCH_HEAD || { sleep 5; continue; }
            mkdir -p "tracks/l1-threads/results/$N"
            cp /tmp/result.json "tracks/l1-threads/results/$N/$F"
            git add "tracks/l1-threads/results/$N/$F"
            git commit -q -m "l1-threads: result $F ($N, run ${GITHUB_RUN_ID})" || exit 0
            git push -q origin "pub:$GITHUB_REF_NAME" && exit 0
            sleep $(( (RANDOM % 20) + 5 ))
          done
          exit 1
