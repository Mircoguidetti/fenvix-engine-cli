# Release 1: one engine for every launch language, built and tested together.
#
# build      Rust workspace tests (detpy-core, detpy-node, fenvix-go, fenvix-jvm, fenvix-skip) and every binding:
#            PyO3 wheel (detpy), napi addon (detjs), Go overlay (fenvix-go + libfenvix_go.a), JVM agent + fenvix-skip.
# python     every Python suite (tests/, reviewer files R-019c, R-020/R-020b, R-023/R-023b, R-032/R-032b,
#            culprit keys), Python 3.12, 3.13 and 3.14; test_review_results.py informational.
# node       every detjs suite (node/test, reviewer files R-021/R-021b, R-032/R-032b), Node 22, 24 and 26.
# go         fenvix-go suites (review R-025/R-025b included), Go 1.26.        NOT BLOCKING (out of go-live scope)
# jvm        cargo tests of fenvix-jvm/fenvix-skip, control tests (Gradle + Maven, JUnit 5/4) on JDK 8/11/17/21,
#            skip-key tests and review R-022.                                  NOT BLOCKING (out of go-live scope)
# Runs on every push to claude/release-1 (the engine trunk) and on every pull request into it (the gate).
# smoke      one small real repository per language under --det (x2, traces verified) and skip with proof (x2).
# Linux arm64 and macOS arm64 (build, full Python and Node suites, install test): .github/workflows/packages.yml.
name: release-1

on:
  push:
    branches: [claude/release-1]
    paths-ignore: ["sessions/**", "docs/**", "**/results/**"]
  pull_request:
    branches: [claude/release-1]
  workflow_dispatch: {}

# One group per pull request (refs/pull/N/merge) and per pushed branch. On a pull request a newer head cancels the
# runs of the heads it supersedes, never its own: the run of the PR's latest head always completes and is the gate.
# A push to the trunk is never cancelled (each merge publishes its engine artifact).
concurrency:
  group: release-1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - name: Rust workspace tests
        run: cargo test --workspace --exclude detpy-py 2>&1 | tee cargo-test.log | grep -E "^test result|FAILED|panicked"; exit ${PIPESTATUS[0]}
      # the binaries every job below tests are the ones the engine artifact ships: manylinux_2_28 (glibc 2.28 floor,
      # through zig), checked by release/check_floor.py (audit G-0479, G-0488, G-0489, G-0250)
      - name: wheel fenvix (cp312-abi3, manylinux_2_28 x86_64)
        run: |
          pip install "maturin>=1.5,<2" ziglang cargo-zigbuild twine
          python3 release/version.py
          maturin build --release --zig --compatibility manylinux_2_28 -o dist && twine check --strict dist/*.whl
      - name: napi addon (detjs, glibc 2.28)
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo zigbuild -p detpy-node --release --target x86_64-unknown-linux-gnu.2.28
          cp target/x86_64-unknown-linux-gnu/release/libdetpy_node.so dist/detjs.linux-x64.node
      - name: platform floor (glibc 2.28)
        run: python3 release/check_floor.py dist/fenvix-*.whl dist/detjs.linux-x64.node
      - name: engine artifact (one versioned tarball + sha256)
        run: |
          export ENGINE_BUILD="r${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          release/engine/assemble.sh dist engine-artifact
          cp release/install_test.py engine-artifact/
      - uses: actions/upload-artifact@v4
        with: {name: engine-artifact, path: engine-artifact/}
      - name: Go overlay core (libfenvix_go.a)
        run: |
          cargo build -p fenvix-go --release && cp target/release/libfenvix_go.a dist/
          (cd go && CGO_ENABLED=1 go build -o ../dist/fenvix-go ./cmd/fenvix-go)
      - name: JVM agent and fenvix-skip
        run: ./jvm/build.sh && cp jvm/dist/fenvix-agent.jar target/release/fenvix-skip dist/
      - uses: actions/upload-artifact@v4
        with: {name: engine-linux-x64, path: dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cargo-test-log, path: cargo-test.log}

  # The Python suite in shards (release/ci/shard.py): shard 0 is the serial shard (release/ci/serial-files.txt: tests
  # that write into the interpreter's site-packages), shards 1..3 split the other files by measured duration. Each
  # shard runs whole files serially, in pytest's order, on its own runner. The job `python (V)` is the gate per
  # version: it fails unless every shard passed and the union of the shards' collected ids equals the full
  # collection exactly (no id missing, none twice), and every collected id has a result.
  python-shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        shard: [0, 1, 2, 3]
    name: python ${{ matrix.python }} shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      # the extension also goes into the source tree, as maturin develop leaves it for the parent branches' gates:
      # R-008/R-008b start interpreters that import detpy from python/
      - name: install the wheel (and its extension in python/detpy)
        run: |
          pip install pytest pytest-xdist && pip install --no-deps dist/fenvix-*.whl
          cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: shard ${{ matrix.shard }} of the Python suites and reviewer test files
        # one deselected pre-existing failure (R-017 H2 reads a results file no engine change touches), as before
        run: |
          set +e
          mapfile -t files < <(python3 release/ci/shard.py files --shard ${{ matrix.shard }} --of 4)
          printf '%s\n' "${files[@]}"
          D=(--deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does)
          python -m pytest --collect-only -q -p no:randomly "${files[@]}" "${D[@]}" > collected.txt || { cat collected.txt; exit 1; }
          python -m pytest -q -p no:randomly --junitxml=junit.xml "${files[@]}" "${D[@]}" -rfE > py.log 2>&1; rc=$?
          tail -60 py.log; echo "== failures"; grep -E "^(FAILED|ERROR) " py.log
          echo "== tracebacks"; sed -n '/^=* FAILURES =*$/,/^=* short test summary/p' py.log | cut -c1-400 | head -3000
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "python-${{ matrix.python }}-shard-${{ matrix.shard }}", path: "collected.txt\njunit.xml\npy.log"}

  python-extras:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - run: pip install --no-deps dist/fenvix-*.whl && cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: runner suites with their runners installed (audit G-0010; own environment, so that pytest-django does not load into the main suites)
        if: success() || failure()
        run: |
          python -m venv .venv-runners && . .venv-runners/bin/activate
          pip install -q pytest pytest-xdist django pytest-django nose2 ward zope.testrunner && pip install -q --no-deps dist/fenvix-*.whl
          python -m pytest -q -p no:randomly -rfE tests/test_runners_django.py tests/test_runners_nose2.py \
            tests/test_runners_ward.py tests/test_runners_zope.py tests/test_django_order.py tests/test_django_pytest_cache.py \
            2>&1 | tee py-${{ matrix.python }}.runners.log | tail -30; exit ${PIPESTATUS[0]}
      - name: suites that need numpy and time-machine (no pytest plugin of their own)
        if: success() || failure()
        run: |
          python -m venv .venv-numpy && . .venv-numpy/bin/activate
          pip install -q pytest pytest-xdist numpy time-machine && pip install -q --no-deps dist/fenvix-*.whl
          python -m pytest -q -p no:randomly -rfEs tests/test_clock.py::test_time_machine_travel_is_honoured \
            tests/test_clock_rust.py tests/test_level0_seeds_fsorder_rust.py \
            2>&1 | tee py-${{ matrix.python }}.numpy.log | tail -30; exit ${PIPESTATUS[0]}
      - name: tests that need hypothesis and pytest-benchmark (auto-loaded plugins, so in their own environment)
        if: success() || failure()
        run: |
          python -m venv .venv-hyp && . .venv-hyp/bin/activate
          pip install -q pytest pytest-xdist hypothesis pytest-benchmark && pip install -q --no-deps dist/fenvix-*.whl
          python -m pytest -q -p no:randomly -rfEs tests/test_clock.py::test_real_pytest_benchmark \
            tests/review_r032/test_review_r032_python.py::test_p12_hypothesis_profile_env \
            tests/test_runners_unittest.py::test_hypothesis_is_seeded_per_test_and_has_no_database \
            2>&1 | tee py-${{ matrix.python }}.hyp.log | tail -30; exit ${PIPESTATUS[0]}
      - name: R-001 results checks (test_review_results.py; informational, not a gate)
        continue-on-error: true
        run: python -m pytest -q -p no:randomly test_review_results.py 2>&1 | tail -20; exit ${PIPESTATUS[0]}

  python:
    needs: [build, python-shard, python-extras]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - uses: actions/download-artifact@v4
        with: {pattern: "python-${{ matrix.python }}-shard-*", path: shards}
      - run: pip install pytest pytest-xdist && pip install --no-deps dist/fenvix-*.whl && cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: the shards together are exactly the full suite
        run: |
          python -m pytest --collect-only -q -p no:randomly tests \
            --deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does > full.txt
          python3 release/ci/shard.py check --full full.txt --shard-collected shards/*/collected.txt --junit shards/*/junit.xml
      - name: measured seconds per test file (release/ci/durations.json is refreshed from this)
        if: always()
        run: python3 release/ci/shard.py durations --junit shards/*/junit.xml
      - name: every shard and the extras passed
        run: |
          echo "shards: ${{ needs.python-shard.result }}  extras: ${{ needs.python-extras.result }}"
          test "${{ needs.python-shard.result }}" = success && test "${{ needs.python-extras.result }}" = success

  # ONE-TIME PROOF (founder's condition c): on this commit the full serial suite runs as before and its pass / fail /
  # skip sets are compared with the sharded run's. Removed once the run ids are recorded in the report.
  python-serial-proof:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - run: |
          pip install pytest pytest-xdist && pip install --no-deps dist/fenvix-*.whl
          cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: the full serial suite, as the gate ran it before sharding
        run: |
          python -m pytest -q -p no:randomly --junitxml=serial.xml tests \
            --deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does \
            -rfE 2>&1 | tail -40; echo "rc=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "python-${{ matrix.python }}-serial-proof", path: serial.xml}

  shard-proof:
    needs: [python-shard, python-serial-proof]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "python-${{ matrix.python }}-*", path: res}
      - name: serial and sharded runs give the same pass / fail / skip sets
        run: python3 release/ci/shard.py compare --a res/python-${{ matrix.python }}-serial-proof/serial.xml --b res/python-${{ matrix.python }}-shard-*/junit.xml

  node:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: cp dist/detjs.linux-x64.node node/ && pip install --no-deps dist/fenvix-*.whl
      - name: detjs suites and reviewer test files
        working-directory: node
        run: |
          set +e  # print the log and the failures before failing (bash -e would stop at the test command)
          npm ci --no-audit --no-fund || exit 1
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../node-tests-${{ matrix.node }}.xml test/*.test.js > ../node-tests-${{ matrix.node }}.log 2>&1; rc=$?
          tail -40 ../node-tests-${{ matrix.node }}.log; echo "== failures"; sed -n '/^✖ failing tests:/,$p' ../node-tests-${{ matrix.node }}.log | grep -vE "^\s+at " | head -400
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "node-tests-${{ matrix.node }}", path: "node-tests-${{ matrix.node }}.*"}

  go:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true  # Go is in the tree but out of go-live scope: reported, not a gate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - run: mkdir -p target/release && cp dist/libfenvix_go.a target/release/
      - name: Go shell suites (review R-025/R-025b included)
        working-directory: go
        run: go vet ./... && go test -count=1 -v ./... 2>&1 | tee ../go-tests.log | grep -E "^(--- FAIL|ok|FAIL|PASS)" ; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: go-tests, path: go-tests.log}

  jvm:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true  # JVM is in the tree but out of go-live scope: reported, not a gate
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: mkdir -p jvm/dist target/release && cp dist/fenvix-agent.jar jvm/dist/ && cp dist/fenvix-skip target/release/ && chmod +x target/release/fenvix-skip && pip install blake3
      - name: control tests (Gradle, Maven; JUnit 5, JUnit 4)
        run: |
          export JAVA_HOME=$JAVA_HOME_${{ matrix.java }}_X64; export PATH=$JAVA_HOME/bin:$PATH
          mkdir -p out && python3 jvm/test/run_controls.py --out out/controls-java${{ matrix.java }}.json | tee out/controls-java${{ matrix.java }}.txt
          exit ${PIPESTATUS[0]}
      - name: skip-key tests and review R-022
        if: matrix.java == '21'
        run: |
          python3 jvm/test/run_skipkeys.py --out out/skipkeys.json | tee out/skipkeys.txt; a=${PIPESTATUS[0]}
          python3 jvm/test/run_review_r022.py --out out/review-r022.json | tee out/review-r022.txt; b=${PIPESTATUS[0]}
          exit $((a|b))
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "jvm-${{ matrix.java }}", path: out/}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.lang == 'go' || matrix.lang == 'jvm' }}  # Go/JVM out of go-live scope
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lang: [python, node, go, jvm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - name: install the engine as the runner image does (release/install-image.sh)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          sudo mkdir -p /opt/fenvix && sudo chown "$USER" /opt/fenvix
          release/install-image.sh dist /opt/fenvix
      - name: smoke ${{ matrix.lang }} (--det x2 verified, skip with proof x2)
        env: {FENVIX_HOME: /opt/fenvix}
        run: python3 release/smoke.py --lang ${{ matrix.lang }} --engine . --work /tmp/smoke --out smoke-${{ matrix.lang }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.lang }}"
          path: |
            smoke-${{ matrix.lang }}.json
            /tmp/smoke/logs/

  # The engine artifact, installed alone (no checkout) in clean containers: the glibc 2.28 floor (manylinux_2_28,
  # AlmaLinux 8) and current Debian images, each CPython 3.12/3.13/3.14 with Node 22/24/26; CPython 3.11 is refused.
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "glibc 2.28, CPython 3.12, pytest 8.1, Node 22", image: "quay.io/pypa/manylinux_2_28_x86_64", python: "/opt/python/cp312-cp312/bin/python3.12", node: "22", mode: "--pytest pytest==8.1.*"}
          - {name: "Debian 12, CPython 3.13, Node 24", image: "python:3.13-slim-bookworm", python: "python3", node: "24", mode: ""}
          - {name: "Debian, CPython 3.14, Node 26", image: "python:3.14-slim", python: "python3", node: "26", mode: ""}
          - {name: "CPython 3.11 refused", image: "python:3.11-slim", python: "python3", node: "", mode: "--refuse"}
    name: install (${{ matrix.name }})
    container: {image: "${{ matrix.image }}"}
    steps:
      - name: git
        run: command -v git || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null)
      - uses: actions/setup-node@v4
        if: matrix.node != ''
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-artifact, path: engine}
      - name: install only the engine artifact; real Python and Vitest projects (or the refusal)
        run: |
          ${{ matrix.python }} engine/install_test.py --artifact "$(ls engine/fenvix-engine-*.tar.gz)" \
            --python ${{ matrix.python }} ${{ matrix.mode }} --work /tmp/it --out install-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "install-${{ strategy.job-index }}"
          path: |
            install-result.json
            /tmp/it/logs/

  # Every merge into the trunk publishes its engine artifact as a GitHub pre-release with a stable URL, for the
  # runner image to pin by URL and sha256 and fetch with release/engine/fetch.sh (fail closed on any other checksum):
  #   https://github.com/<owner>/<repo>/releases/download/engine-<version>-r<run>.<sha7>/fenvix-engine-<...>.tar.gz
  # On a pull request the same script runs with --dry-run: every check, the fetch accepted with the pinned sha256
  # and refused with another one, the tag, URL and notes; only the release itself is not created.
  publish-engine:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/release-1'
    needs: [build, python, node, smoke, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: engine-artifact, path: engine}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: release/engine/publish.sh engine

  publish-engine-dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: engine-artifact, path: engine}
      - run: release/engine/publish.sh --dry-run engine
