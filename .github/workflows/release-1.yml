# Release 1: the engine of the go-live (Python and Node on our machines), built and tested together.
#
# Two depths of the same jobs (CI rule of 2026-11-20, founder decision):
#   LIGHT  every pull request into claude/release-1 (the required check before merge) and every merge into it:
#          build, Python 3.13 full suite, Node 24 full suite, smoke python/node.
#   FULL   by hand (workflow_dispatch, depth "full", the default) and nightly (schedule): Python 3.12, 3.13, 3.14 and
#          Node 22, 24, 26, each the full suite, plus the smoke jobs. A step of work ends with a full run.
# Pushes to session branches run nothing. On a pull request a new head cancels that pull request's older run (only
# the newest head is tested); a run on the trunk or a scheduled/manual run is never cancelled by another.
# Go, the JVM, macOS and Linux arm64 are outside the go-live scope and are not built or tested here.
#
# build      Rust tests of the go-live crates (detpy-core, detpy-node), the wheel and the napi addon.
# python     every Python suite (tests/, reviewer files), one job per version; test_review_results.py informational.
# node       every detjs suite (node/test, reviewer files), one job per version.
# smoke      one small real repository per language (Python, Node) under --det (x2, traces verified) and skip with
#            proof (x2), installed as the runner image does.
# Note: GitHub runs `schedule` and offers "Run workflow" only for workflows on the repository's default branch.
name: release-1

on:
  push:
    branches: [claude/release-1]
    paths-ignore: ["sessions/**", "docs/**", "**/results/**"]
  pull_request:
    branches: [claude/release-1]
  workflow_dispatch:
    inputs:
      depth:
        description: "full: Python 3.12/3.13/3.14 and Node 22/24/26; light: Python 3.13 and Node 24"
        type: choice
        options: [full, light]
        default: full
  schedule:
    - cron: "37 2 * * *"   # nightly full run

concurrency:
  group: release-1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      - name: Rust tests of the go-live crates
        run: cargo test -p detpy-core -p detpy-node 2>&1 | tee cargo-test.log | grep -E "^test result|FAILED|panicked"; exit ${PIPESTATUS[0]}
      - name: PyO3 wheel (detpy)
        run: pip install "maturin>=1.5,<2" && maturin build --release --compatibility linux -o dist
      - name: napi addon (detjs)
        run: cargo build -p detpy-node --release && cp target/release/libdetpy_node.so dist/detjs.linux-x64.node
      - uses: actions/upload-artifact@v4
        with: {name: engine-linux-x64, path: dist/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cargo-test-log, path: cargo-test.log}

  python:
    needs: build
    runs-on: ubuntu-latest
    # serial on purpose: some suites change the interpreter's site-packages (R-019c E9/E10) and cannot share it
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.depth != 'light')) && '["3.12", "3.13", "3.14"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
      # the extension also goes into the source tree, as maturin develop leaves it for the parent branches' gates:
      # R-008/R-008b start interpreters that import detpy from python/
      - name: install the wheel (and its extension in python/detpy)
        run: |
          pip install pytest pytest-xdist && pip install --no-deps dist/detpy-*.whl
          cp "$(python -c 'import detpy._core as c; print(c.__file__)')" python/detpy/
      - name: Python suites and reviewer test files
        # the gate of claude/parallel-proof-3 REPORT-3 and claude/all-runners-2 REPORT-2: serial, one deselected
        # pre-existing failure (R-017 H2 reads a results file no engine change touches)
        run: |
          python -m pytest -q -p no:randomly --junitxml=py-${{ matrix.python }}.xml tests \
            --deselect tests/test_review_r017.py::test_h2_report_says_ci_never_sees_tmp_name_exhaustion_but_p8_does \
            -rfE 2>&1 | tee py-${{ matrix.python }}.log | tail -60; rc=${PIPESTATUS[0]}
          echo "== failures"; grep -E "^(FAILED|ERROR) " py-${{ matrix.python }}.log || true
          exit $rc
      - name: R-001 results checks (test_review_results.py; informational, not a gate)
        continue-on-error: true
        run: python -m pytest -q -p no:randomly test_review_results.py 2>&1 | tee py-r001-${{ matrix.python }}.log | tail -20; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "python-${{ matrix.python }}", path: "py-${{ matrix.python }}.*"}

  node:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.depth != 'light')) && '["22", "24", "26"]' || '["24"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - run: cp dist/detjs.linux-x64.node node/ && pip install --no-deps dist/detpy-*.whl
      - name: detjs suites and reviewer test files
        working-directory: node
        run: |
          set +e  # print the log and the failures before failing (bash -e would stop at the test command)
          npm ci --no-audit --no-fund || exit 1
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=../node-tests-${{ matrix.node }}.xml test/*.test.js > ../node-tests-${{ matrix.node }}.log 2>&1; rc=$?
          tail -40 ../node-tests-${{ matrix.node }}.log; echo "== failures"; sed -n '/^✖ failing tests:/,$p' ../node-tests-${{ matrix.node }}.log | grep -vE "^\s+at " | head -400
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "node-tests-${{ matrix.node }}", path: "node-tests-${{ matrix.node }}.*"}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lang: [python, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with: {name: engine-linux-x64, path: dist}
      - name: install the engine as the runner image does (release/install-image.sh)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          sudo mkdir -p /opt/fenvix && sudo chown "$USER" /opt/fenvix
          release/install-image.sh dist /opt/fenvix
      - name: smoke ${{ matrix.lang }} (--det x2 verified, skip with proof x2)
        env: {FENVIX_HOME: /opt/fenvix}
        run: python3 release/smoke.py --lang ${{ matrix.lang }} --engine . --work /tmp/smoke --out smoke-${{ matrix.lang }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.lang }}"
          path: |
            smoke-${{ matrix.lang }}.json
            /tmp/smoke/logs/
