name: cache-proof

# Cache with proof (P-013): measure `pytest --det --det-cache=DIR` over consecutive commits.
# Triggered by a push that changes tracks/cache-proof/run.json. The engine is the base commit in
# tracks/cache-proof/patches/BASE plus the patches in that folder (git am).
#   build -> engine checkout + patches, detpy wheel, job matrix from run.json
#   walk  -> one job per (spec, shard): engine/harness/cache_proof/walk.py; results committed (rebase-retry) to
#            tracks/cache-proof/results/<run_id>/

on:
  push:
    branches: [claude/loving-maxwell-58mv2w]
    paths: [tracks/cache-proof/run.json]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  UV_PYTHON_PREFERENCE: managed
  CP_COMMIT: "1"
  CP_BRANCH: claude/loving-maxwell-58mv2w

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      walk: ${{ steps.p.outputs.walk }}
      base: ${{ steps.b.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        run: echo "base=$(tr -d '[:space:]' < tracks/cache-proof/patches/BASE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: {ref: "${{ steps.b.outputs.base }}", path: engine}
      - name: Apply the engine patches
        run: |
          git -C engine config user.name "cache-proof-bot"
          git -C engine config user.email "cache-proof-bot@users.noreply.github.com"
          git -C engine am -q "$GITHUB_WORKSPACE"/tracks/cache-proof/patches/*.patch
          git -C engine log --oneline -5
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install maturin
      - run: cd engine && maturin build --release --compatibility linux -o ../dist
      - uses: actions/upload-artifact@v4
        with: {name: wheel, path: dist/*.whl}
      - id: p
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          run = json.load(open("tracks/cache-proof/run.json"))
          rows = []
          for w in run["walk"]:
              spec = json.load(open(f"engine/harness/cache_proof/specs/{w['spec']}.json"))
              n = w.get("shards", 1)
              for s in range(n):
                  rows.append({"spec": w["spec"], "shard": f"{s}/{n}", "tag": f"{s}of{n}", "budget": w.get("budget_min", 330),
                               "commits": w.get("commits", 0), "apt": " ".join(spec.get("apt", []))})
          print("run_id=" + run["run_id"])
          print("walk=" + json.dumps(rows))
          PY

  walk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJSON(needs.build.outputs.walk) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.build.outputs.base }}", path: engine}
      - name: Apply the engine patches
        run: |
          git -C engine config user.name "cache-proof-bot"
          git -C engine config user.email "cache-proof-bot@users.noreply.github.com"
          git -C engine am -q "$GITHUB_WORKSPACE"/tracks/cache-proof/patches/*.patch
          echo "engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: {name: wheel, path: dist}
      - if: ${{ matrix.apt != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }} > /dev/null
      - name: Walk
        env:
          CP_REPO: ${{ github.workspace }}
        run: |
          git config user.name "cache-proof-bot"
          git config user.email "cache-proof-bot@users.noreply.github.com"
          extra=""
          if [ "${{ matrix.commits }}" != "0" ]; then extra="--commits ${{ matrix.commits }}"; fi
          python3 engine/harness/cache_proof/walk.py --spec "engine/harness/cache_proof/specs/${{ matrix.spec }}.json" \
            --work "$RUNNER_TEMP/w" --wheel "$(ls dist/*.whl)" --shard "${{ matrix.shard }}" \
            --budget-min "${{ matrix.budget }}" $extra \
            --out "tracks/cache-proof/results/${{ needs.build.outputs.run_id }}/${{ matrix.spec }}-${{ matrix.tag }}.json.gz"
