[package]
name = "fenvix-jvm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "JVM bindings (JNI) for detpy-core, loaded by the fenvix Java agent (jvm/)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detpy-core = { path = "../detpy-core" }
jni = { version = "0.21", default-features = false }
serde_json = "1"
blake3 = "1.8"
