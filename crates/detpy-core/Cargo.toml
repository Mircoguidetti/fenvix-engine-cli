[package]
name = "detpy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic test execution core: execution fingerprints, run verifier, trace and cassette formats."

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
