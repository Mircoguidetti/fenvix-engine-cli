[package]
name = "detpy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic test execution core: execution fingerprints, run verifier, trace and cassette formats."

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
