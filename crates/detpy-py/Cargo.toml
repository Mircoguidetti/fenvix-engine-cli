[package]
name = "detpy-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
detpy-core = { path = "../detpy-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
sha2 = "0.10"
