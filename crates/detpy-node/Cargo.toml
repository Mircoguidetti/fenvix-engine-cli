[package]
name = "detpy-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Node.js bindings (napi-rs) for detpy-core, used by the detjs Vitest/Jest shells."

[lib]
crate-type = ["cdylib"]

[dependencies]
detpy-core = { path = "../detpy-core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
